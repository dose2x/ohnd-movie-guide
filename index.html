<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The OHND Movie Guide</title>
<style>
  :root {
    --bg: #100a1c;
    --card: #1c1330;
    --text: #f1edf8;
    --muted: #a396c2;
    --accent: #a855f7;
    --accent2: #7c3aed;
    --fresh: #34d399;
    --rotten: #f43f5e;
    --border: #35275a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(168, 85, 247, 0.25), transparent),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 28px 20px 16px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  header .logo {
    width: 100px;
    height: 100px;
    object-fit: cover;
    object-position: center;
    margin: 0 auto 12px;
    display: block;
    border-radius: 50%;
    border: 3px solid var(--accent);
    box-shadow: 0 0 22px rgba(168, 85, 247, 0.65), 0 0 0 6px rgba(168, 85, 247, 0.12);
  }
  header .logo.hidden { display: none; }
  header h1 {
    margin: 0 0 4px;
    font-size: 1.9rem;
    letter-spacing: -0.5px;
  }
  header h1 span {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p { margin: 0; color: var(--muted); font-size: 0.9rem; }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }

  .search-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 1rem;
  }
  input[type="text"]:focus { outline: 2px solid var(--accent); }
  button {
    padding: 12px 18px;
    border-radius: 8px;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.95rem;
  }
  button:hover { filter: brightness(1.15); }

  #status { color: var(--muted); font-size: 0.9rem; margin: 20px 0 12px; min-height: 1.2em; }
  #status.error { color: var(--rotten); }

  .card {
    display: none;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    margin-top: 16px;
    gap: 20px;
    grid-template-columns: 140px 1fr;
    box-shadow: 0 8px 30px rgba(124, 58, 237, 0.15);
  }
  .card.visible { display: grid; }
  .card img.poster {
    width: 140px;
    border-radius: 8px;
    background: #000;
    align-self: start;
  }
  .card .info h2 { margin: 0 0 2px; font-size: 1.4rem; }
  .card .info .meta { color: var(--muted); font-size: 0.85rem; margin-bottom: 12px; }

  .scores { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .score-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #150e26;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 0.85rem;
  }
  .score-pill .val { font-weight: 700; }
  .score-pill.rt .val.fresh { color: var(--fresh); }
  .score-pill.rt .val.rotten { color: var(--rotten); }

  .section { margin-bottom: 14px; }
  .section h3 {
    margin: 0 0 4px;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--muted);
  }
  .section p { margin: 0; line-height: 1.5; font-size: 0.95rem; }

  @media (max-width: 480px) {
    .card { grid-template-columns: 1fr; }
    .card img.poster { width: 100%; max-width: 200px; margin: 0 auto; }
  }
</style>
</head>
<body>

<header>
  <img class="logo" id="logo" src="logo.jpg" alt="OHND logo" onerror="this.classList.add('hidden')">
  <h1>The <span>OHND</span> Movie Guide</h1>
  <p>Rotten Tomatoes score, synopsis &amp; cast in one search</p>
</header>

<div class="container">
  <div class="search-row">
    <input type="text" id="query" placeholder="Search a movie title (e.g. The Matrix)" autocomplete="off">
    <button id="searchBtn">Search</button>
  </div>
  <div id="status"></div>

  <div class="card" id="card">
    <img class="poster" id="poster" src="" alt="Poster">
    <div class="info">
      <h2 id="title"></h2>
      <div class="meta" id="meta"></div>
      <div class="scores" id="scores"></div>
      <div class="section">
        <h3>Synopsis</h3>
        <p id="plot"></p>
      </div>
      <div class="section">
        <h3>Actors</h3>
        <p id="actors"></p>
      </div>
      <div class="section">
        <h3>Director</h3>
        <p id="director"></p>
      </div>
    </div>
  </div>
</div>

<script>
const PROXY_URL = "https://ohnd-movie-proxy.ohndtomatometer.workers.dev";

const els = {
  query: document.getElementById("query"),
  searchBtn: document.getElementById("searchBtn"),
  status: document.getElementById("status"),
  card: document.getElementById("card"),
  poster: document.getElementById("poster"),
  title: document.getElementById("title"),
  meta: document.getElementById("meta"),
  scores: document.getElementById("scores"),
  plot: document.getElementById("plot"),
  actors: document.getElementById("actors"),
  director: document.getElementById("director"),
};

function setStatus(msg, isError) {
  els.status.textContent = msg || "";
  els.status.classList.toggle("error", !!isError);
}

function ratingClass(value) {
  const num = parseInt(value, 10);
  if (isNaN(num)) return "";
  return num >= 60 ? "fresh" : "rotten";
}

async function searchMovie() {
  const title = els.query.value.trim();
  if (!title) {
    setStatus("Type a movie title first.", true);
    return;
  }
  els.card.classList.remove("visible");
  setStatus("Searching...");

  try {
    const url = `${PROXY_URL}/?t=${encodeURIComponent(title)}`;
    const res = await fetch(url);
    const data = await res.json();

    if (data.Response === "False") {
      setStatus(data.Error || "Movie not found.", true);
      return;
    }

    setStatus("");
    els.title.textContent = `${data.Title} (${data.Year})`;
    els.meta.textContent = [data.Rated, data.Runtime, data.Genre].filter(Boolean).join(" • ");
    els.poster.src = (data.Poster && data.Poster !== "N/A") ? data.Poster : "";
    els.poster.alt = data.Title;
    els.plot.textContent = data.Plot && data.Plot !== "N/A" ? data.Plot : "No synopsis available.";
    els.actors.textContent = data.Actors && data.Actors !== "N/A" ? data.Actors : "Not listed.";
    els.director.textContent = data.Director && data.Director !== "N/A" ? data.Director : "Not listed.";

    els.scores.innerHTML = "";
    const ratings = data.Ratings || [];
    ratings.forEach(r => {
      const pill = document.createElement("div");
      pill.className = "score-pill" + (r.Source === "Rotten Tomatoes" ? " rt" : "");
      const cls = r.Source === "Rotten Tomatoes" ? ratingClass(r.Value) : "";
      pill.innerHTML = `<span>${r.Source}</span><span class="val ${cls}">${r.Value}</span>`;
      els.scores.appendChild(pill);
    });
    if (data.Metascore && data.Metascore !== "N/A" && !ratings.some(r => r.Source === "Metacritic")) {
      const pill = document.createElement("div");
      pill.className = "score-pill";
      pill.innerHTML = `<span>Metascore</span><span class="val">${data.Metascore}</span>`;
      els.scores.appendChild(pill);
    }

    els.card.classList.add("visible");
  } catch (err) {
    setStatus("Something went wrong. Check your connection and try again.", true);
  }
}

els.searchBtn.addEventListener("click", searchMovie);
els.query.addEventListener("keydown", (e) => {
  if (e.key === "Enter") searchMovie();
});

</script>

</body>
</html>
